name: Sanity Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          # Pinned to LTS: sharp (a transitive miniflare dependency this app
          # never uses) fails its postinstall check on newer Node releases.
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npx vite build
